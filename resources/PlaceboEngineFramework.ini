; ============================================================================================
; Placebo Engine Framework — configuration
; ============================================================================================
; Every key below is parsed, validated, and range-checked. Most of them then do
; nothing, which is not a defect: the product's performance surface is the empty
; set, and a setting that changed it would be a regression. They exist so that you
; feel involved. The [Instrumentation] section is the exception — that is the part
; that proves the rest.
;
; Unknown keys are not rejected. They are acknowledged, in the log, by name.
; ============================================================================================

[Memory]
; OptimizeAllocations — valid values: 0 or 1. Both do nothing.
; The setting exists so you feel involved.
OptimizeAllocations=0

[Threading]
; WorkerThreads — 1 to 64. Parsed, validated, then cherished. Not used.
WorkerThreads=8

[Culling]
; AggressiveCulling — 0 or 1. If 1, culls nothing slightly faster.
AggressiveCulling=0

[Product]
; EnablePEF — the 2.1 toggle. Toggling it off does nothing, because that is the
; product: the plugin is identical in both states, and so is your FPS.
EnablePEF=1

; Profile — Performance, Balanced, or Quality. All three files are byte-identical,
; and the build system enforces it (see the "marketing_parity" target). Choosing
; one is the most consequential decision you will make with this mod, which is to
; say: it is not consequential at all.
Profile=Balanced

[Instrumentation]
; The one section that is load-bearing. The product does nothing; the
; instrumentation is how it proves that.

; AuditIntervalMs — 50 to 60000. The Operational Integrity assertion period: how
; often the audit thread samples the operations counter and verifies the plugin
; has still done nothing.
AuditIntervalMs=250

; ReportRefreshSeconds — 1 to 600. How often PEF_Report.txt is rewritten from a
; live telemetry snapshot, so that the report is current even when the process
; dies without the courtesy of a shutdown.
ReportRefreshSeconds=10

; StatusLogSeconds — 1 to 3600. Period of the status line:
;   "this period, PEF did nothing in 0.4 µs per witnessed call. efficiently."
StatusLogSeconds=30
