; ============================================================================================
; Placebo Engine Framework — performance profile
; ============================================================================================
; You have selected this file by its name. The name is the difference.
; The difference is the name.
;
; This file is byte-identical to Performance.ini, Balanced.ini, and Quality.ini.
; That is not an oversight; it is a product requirement, and the build enforces it:
; if any profile ever diverges, the build fails before a difference can ship.
; This is called marketing parity.
; ============================================================================================

[Memory]
OptimizeAllocations=0

[Threading]
WorkerThreads=8

[Culling]
AggressiveCulling=0

[Product]
EnablePEF=1
Profile=TheOneYouPicked

[Instrumentation]
AuditIntervalMs=250
ReportRefreshSeconds=10
StatusLogSeconds=30
